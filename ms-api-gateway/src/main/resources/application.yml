server:
  port: 8080
spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: products
          uri: lb://ms-product-service
          predicates: [ Path=/products/** ]
          filters: [ StripPrefix=1 ]
        - id: suppliers
          uri: lb://ms-supplier-service
          predicates: [ Path=/suppliers/** ]
          filters: [ StripPrefix=1 ]
        - id: invoices
          uri: lb://ms-invoice-service
          predicates: [ Path=/invoices/** ]
          filters: [ StripPrefix=1 ]
        - id: auth
          uri: lb://ms-auth-service
          predicates: [ Path=/auth/** ]
          filters: [ StripPrefix=1 ]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
